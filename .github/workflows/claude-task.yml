name: Claude Code Task

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Owner-authored [claude] issue number"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: claude-task-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.user.login == github.repository_owner &&
        startsWith(github.event.issue.title, '[claude]')
      )
    runs-on: [self-hosted, claude-code]
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      CLAUDE_MAX_TURNS: "40"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run trusted Claude task
        shell: bash
        run: |
          set +e
          bash scripts/run-claude-task.sh "$ISSUE_NUMBER"
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          # The runner creates a unique branch per Actions run and sets its
          # upstream only after a successful push. If a later step such as
          # PR creation is blocked by repository policy, preserve the useful
          # result instead of reporting the entire Claude coding task as failed.
          branch="claude/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          if upstream="$(git rev-parse --abbrev-ref --symbolic-full-name "${branch}@{upstream}" 2>/dev/null)" \
            && [[ "$upstream" == "origin/$branch" ]]; then
            echo "::warning::Claude completed and pushed ${branch}, but post-push automation failed. The branch is recoverable and can be opened as a PR manually or by ChatGPT."
            exit 0
          fi

          exit "$status"
