name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Sync project
        shell: bash
        run: |
          if [[ -f uv.lock ]]; then
            uv sync --locked
          else
            uv sync
          fi

      - name: Ruff
        run: uv run --no-sync ruff check src tests

      - name: Tests
        run: uv run --no-sync pytest -q
