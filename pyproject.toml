[project]
name = "cn-property-agent"
version = "0.1.0"
description = "China residential property due-diligence and value-preservation research platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "pydantic-settings>=2",
  "duckdb>=1",
  "polars>=1",
  "httpx>=0.27",
  "fastapi>=0.115",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cn_property_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
